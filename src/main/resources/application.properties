spring.application.name=prometheus-grafana

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:monitoring-db;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator - expose prometheus endpoint
management.endpoints.web.exposure.include=health,info,prometheus,logfile
management.endpoint.health.show-details=always

# Management (Actuator) security - credentials used by Prometheus to scrape
management.security.username=prometheus
management.security.password=prometheus

# Point logfile endpoint to the same application log file
management.endpoint.logfile.external-file=logs/application.log

# Micrometer prometheus (micrometer registry is on the classpath)
management.prometheus.metrics.export.enabled=true

# Tag application name
management.metrics.tags.application=prometheus-grafana

# Logging
logging.file.name=logs/application.log
logging.level.root=INFO